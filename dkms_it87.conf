PACKAGE_NAME="asustor-it87"
PACKAGE_VERSION="v0.0.1"

MAKE="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

# frankcrawford/it87, vendored (see it87.UPSTREAM). It has the same name as
# the in-tree it87, which DKMS overrides (current DKMS versions install to
# /updates/dkms instead of DEST_MODULE_LOCATION).
BUILT_MODULE_NAME="it87"
DEST_MODULE_LOCATION="/kernel/drivers/hwmon"

AUTOINSTALL="yes"
